<!doctype html>
<html lang="ar" dir="rtl" data-theme="forest">
<head>
  <meta charset="utf-8">
  <title>EWMS — نظام إدارة سير العمل</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f7">
  <link rel="icon" type="image/svg+xml" href="brand/logo.svg">
  <link rel="preload" href="fonts/qomra-arabic-regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/qomra-arabic-bold.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // المظهر المحفوظ قبل تحميل Angular (نفس منطق ThemeService) — حتى لا تومض الألوان عند الفتح
    (function () {
      try {
        var saved = JSON.parse(localStorage.getItem('ewms_appearance') || 'null') || {};
        var root = document.documentElement;
        if (/^(forest|wheat|charcoal|umber)$/.test(saved.palette)) root.setAttribute('data-theme', saved.palette);
        if (saved.mode === 'light' || saved.mode === 'dark') root.setAttribute('data-mode', saved.mode);
      } catch (e) { /* التخزين غير متاح */ }
    })();
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
