@if (attachments().length) {
  <div class="att">
    <span class="label">المرفقات ({{ attachments().length }})</span>
    <div class="chips">
      @for (a of attachments(); track a.id) {
        <button type="button" class="chip" (click)="current.set(a)" [title]="'عرض ' + a.fileName">
          <app-icon [name]="a.contentType === 'application/pdf' ? 'docText' : 'photo'" [size]="16" />
          <span class="name">{{ a.fileName }}</span><span class="size">{{ size(a.size) }}</span>
        </button>
      }
    </div>
  </div>
}

<app-file-preview [file]="current()" [load]="blob" (closed)="current.set(null)" />
